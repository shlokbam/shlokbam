name: Update profile images
on:
  schedule:
    - cron: '17 3 * * *'          # daily, 03:17 UTC
  workflow_dispatch:               # "Run workflow" button in the Actions tab
  push:
    paths:
      - 'tools/data/profile.json'  # editing profile.json rebuilds the images
permissions:
  contents: write
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools brotli
      - run: python tools/update.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
                - name: Commit changes
        run: |
          git config user.name  "Shlok Bam"
          git config user.email "147968468+shlokbam@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh profile images"
          git pull --rebase
          git push
