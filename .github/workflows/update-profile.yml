name: Update profile images
on:
  schedule:
    - cron: '17 3 * * *'      # daily, 03:17 UTC
  workflow_dispatch:           # also lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools brotli
      - run: python tools/update.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name  "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh profile images"
          git push
