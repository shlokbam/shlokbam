name: Update profile
# Rebuilds assets/spec/*.svg and README.md from tools/spec/content.json + live GitHub data,
# then commits as Shlok so the change shows on the contribution graph.
on:
  schedule:
    - cron: '17 3 * * *'            # daily, 03:17 UTC (08:47 IST)
    - cron: '43 14 * * *'   # 20:13 IST backup, in case the morning run is dropped
  workflow_dispatch:                 # "Run workflow" button in the Actions tab
  push:
    branches: [ main ]
    paths:
      - 'tools/spec/content.json'    # editing your words rebuilds the cards
      - 'tools/spec/build.py'
permissions:
  contents: write
concurrency:
  group: update-profile
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools brotli
      - name: Build cards and README
        run: python tools/spec/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit as Shlok
        run: |
          git config user.name  "Shlok Bam"
          git config user.email "147968468+shlokbam@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "chore: regenerate profile cards ($(date -u +%F))"
          git pull --rebase
          git push
